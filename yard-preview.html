:root {
  color-scheme: light;
  --display:"Yard WenKai","STKaiti","华文楷体","KaiTi","楷体",serif;
  --body-font:"Yard Song","Noto Serif SC","STSong","华文宋体","SimSun","宋体",serif;
  --ink: #fff8eb;
  --paper: #f4f0e5;
  --accent: #ffe699;
  --sky-top:#3c8ea6;
  --sky-haze:#eaf5cf;
  --sun-disc:#ffe584;
  --ridge-far:#6cb8aa;
  --ridge-near:#3f9385;
  --river:#57a8ae;
  --bank-far:#79c293;
  --bank-near:#3d8b75;
  --water-line:#f2fae4;
  --scrim:#12292d;
  --plinth-shadow:#1c3d3f;
  --mist-opacity:.48;
  --hud-edge:clamp(24px,3vw,56px);
  --hud-top:clamp(24px,3.7vh,46px);
  --hud-bottom:clamp(18px,2.6vh,32px);
  --ruler-step:clamp(26px,3.45vh,38px);
  --hud-dock-width:clamp(94px,7.1vw,128px);
  --hud-rail-width:clamp(210px,17.6vw,280px);
  --hud-ink:#f9f0dd;
  --hud-muted:#e7dfca;
  --hud-gold:#ffd68a;
  --hud-line:#f2e0c473;
  --hud-shadow:1px 1px 2px #0f2226b8;
  --ui-shadow:1px 1px 1px rgb(21 40 35 / 14%);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body[data-season="rain"] {
  --accent:#daf09e;
  --mist-opacity:.60;
  --sky-top:#479396; --sky-haze:#e4f3d6; --sun-disc:#ffeab5; --ridge-far:#7cc3b3;
  --ridge-near:#4da08a; --river:#68b8b3; --bank-far:#88ca95; --bank-near:#489477;
  --scrim:#11292a; --plinth-shadow:#1d403d;
}
body[data-season="dew"] {
  --accent:#ffd49c;
  --mist-opacity:.38;
  --sky-top:#4c6e96; --sky-haze:#f3dfc1; --sun-disc:#ffb56b; --ridge-far:#869cb5;
  --ridge-near:#58728c; --river:#6c8ca3; --bank-far:#bea57f; --bank-near:#687f8d;
  --water-line:#fae9d0; --scrim:#1c2130; --plinth-shadow:#2c2f42;
}
body[data-season="winter"] {
  --accent:#d9ecfa;
  --mist-opacity:.70;
  --sky-top:#4b6a8f; --sky-haze:#e4eff7; --sun-disc:#ffe3b5; --ridge-far:#8aa6bf;
  --ridge-near:#5a7896; --river:#6e8ea8; --bank-far:#c0d4e2; --bank-near:#5f7f9b;
  --water-line:#f0f7fc; --scrim:#132133; --plinth-shadow:#1f334a;
}
body { margin:0; min-width:300px; background:var(--paper); color:var(--ink); font:500 16px/1.5 var(--body-font); font-synthesis:none; }
button { color:inherit; font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible, canvas:focus-visible { outline:2px solid currentColor; outline-offset:-2px; }

.exhibit { position:relative; min-height:100svh; }
.exhibit::before {
  content:""; position:absolute; z-index:2; inset:0; pointer-events:none;
  background:
    linear-gradient(90deg,color-mix(in srgb,var(--scrim) 78%,transparent) 0%,color-mix(in srgb,var(--scrim) 62%,transparent) 12%,color-mix(in srgb,var(--scrim) 26%,transparent) 23%,transparent 36%,transparent 82%,color-mix(in srgb,var(--scrim) 36%,transparent) 100%),
    linear-gradient(0deg,color-mix(in srgb,var(--scrim) 38%,transparent) 0%,transparent 16%);
}
.exhibit.hud-hidden::before { content:none; }
.exhibit.hud-hidden :is(.side-panel,.stage-tools,.stage-hint,.renderer-message,.season-interlude) { display:none; }
.exhibit.hud-hidden :is(#yard-hotspots,#gnomon-target,.gnomon-inspect) { display:none; }
.exhibit.gnomon-focused .stage-hint,
body:has(#season-guide[open]) .stage-hint { opacity:0; }
.exhibit.hud-hidden .guide-toggle { visibility:hidden; }
.hud-dock {
  position:fixed; z-index:3; left:var(--hud-edge); bottom:var(--hud-bottom);
  width:var(--hud-dock-width); display:grid; justify-items:start; gap:clamp(6px,1vh,12px);
  color:var(--hud-ink); text-shadow:var(--hud-shadow);
}
.hud-dock button, .stage-tools button, .guide-close { padding:0; border:0; background:transparent; }
.hud-dock button:hover, .stage-tools button:hover, .guide-close:hover { color:var(--hud-gold); }
.hud-toggle {
  display:grid; place-items:center start; width:clamp(54px,4vw,74px); height:clamp(48px,3.6vw,62px);
}
.hud-toggle svg {
  width:clamp(37px,2.55vw,49px); height:auto; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(1px 1px 1px #13252793);
}
.hud-toggle[aria-pressed="true"] .hud-eye-slash { display:none; }
.hud-toggle[aria-pressed="true"] { color:#203a39; }
.hud-toggle[aria-pressed="true"] svg { filter:drop-shadow(0 1px 1px #fff8e9ba); }
.side-panel {
  position:absolute; z-index:3; top:var(--hud-top); bottom:var(--hud-bottom); left:var(--hud-edge);
  width:var(--hud-rail-width); display:grid; grid-template-rows:auto auto 1fr;
  align-items:start; row-gap:clamp(22px,5vh,50px);
  pointer-events:none; color:var(--hud-ink); text-shadow:var(--hud-shadow);
}
.mast h1 { margin:0; font:500 clamp(40px,3.35vw,65px)/1.12 var(--display); letter-spacing:.07em; white-space:nowrap; }
.calendar { width:100%; }
.ruler-heading {
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  border-bottom:1px solid var(--hud-line); padding-bottom:9px; margin-bottom:6px;
}
.ruler-heading h2 { margin:0; font:500 clamp(20px,1.3vw,25px)/1.2 var(--display); letter-spacing:.09em; }
.ruler-count { color:var(--hud-muted); font-size:clamp(14px,1vw,19px); font-variant-numeric:lining-nums tabular-nums; letter-spacing:.08em; }
#term-number { color:var(--hud-gold); font-size:1.12em; }
.ruler-window {
  position:relative; width:100%; height:calc(9 * var(--ruler-step)); overflow:clip;
  pointer-events:auto; touch-action:pan-x pinch-zoom; user-select:none;
  mask-image:linear-gradient(transparent,#000 13%,#000 87%,transparent);
}
.terms {
  position:absolute; width:100%; top:calc(50% - var(--ruler-step) / 2);
  display:grid; grid-auto-rows:var(--ruler-step);
  transform:translateY(calc(var(--ruler-index) * var(--ruler-step) * -1));
  transition:transform 250ms cubic-bezier(.25,.73,.28,1);
}
.terms::before {
  content:""; position:absolute; top:calc(var(--ruler-step) / 2); bottom:calc(var(--ruler-step) / 2);
  left:10px; width:4px; border-left:1px solid var(--hud-line);
  background:repeating-linear-gradient(to bottom,var(--hud-line) 0 1px,transparent 1px calc(var(--ruler-step) / 4));
}
.calendar-mark {
  position:relative; display:flex; align-items:center; padding-left:36px;
  color:var(--hud-muted); font:500 clamp(15px,1.05vw,19px)/1 var(--body-font); letter-spacing:.12em;
}
.calendar-mark::before, .term::before {
  content:""; position:absolute; left:10px; top:50%; width:11px; border-top:1px solid var(--hud-line);
}
.term {
  position:relative; display:flex; align-items:center; gap:9px; padding:0 0 0 36px;
  border:0; background:transparent; text-align:left; text-shadow:inherit; pointer-events:auto;
}
.term::before { width:17px; border-color:currentColor; }
.term-name { font:500 clamp(18px,1.15vw,22px)/1 var(--display); letter-spacing:.09em; }
.term small { display:none; }
.term[aria-current="true"], .term:hover { color:var(--hud-gold); }
.term[aria-current="true"] .term-name { font-size:clamp(25px,2vw,38px); }
.term[aria-current="true"]::before { width:21px; border-top-width:2px; }
.ruler-cursor {
  position:absolute; z-index:1; left:3px; top:50%; width:7px; height:7px;
  transform:translateY(-50%) rotate(45deg); pointer-events:none;
  background:var(--hud-gold); box-shadow:0 0 9px #ffbf6766;
}
.yard-links { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--hud-line); padding-top:5px; }
.yard-links button {
  position:relative; display:grid; place-items:center; align-content:center; gap:5px;
  min-width:0; min-height:clamp(61px,4.1vw,78px); padding:5px 2px 9px; border:0; background:transparent;
  font:500 clamp(16px,1.05vw,20px)/1 var(--display); white-space:nowrap; text-shadow:inherit; pointer-events:auto;
}
.yard-links button:is([aria-current="true"],:hover) { color:var(--hud-gold); }
.yard-links button[aria-current="true"]::after {
  content:""; position:absolute; bottom:2px; width:18px; border-bottom:2px solid currentColor;
}
.yard-links svg, .stage-tools svg, .guide-close svg, .guide-toggle svg {
  fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round;
}
.yard-links svg { width:clamp(28px,1.9vw,36px); height:auto; }
.season-note {
  position:relative; max-width:100%;
  border-top:1px solid var(--hud-line); padding:13px 0 0 16px;
}
.season-note::before {
  content:""; position:absolute; top:20px; left:1px; width:5px; height:5px;
  transform:rotate(45deg); background:var(--hud-gold);
}
.season-note p { margin:0; font-size:clamp(15px,1.05vw,18px); line-height:1.65; text-wrap:pretty; }
.stage-tools {
  position:absolute; z-index:3; right:var(--hud-edge); bottom:var(--hud-bottom);
  color:var(--hud-ink); text-shadow:var(--hud-shadow);
}
.guide-toggle {
  display:grid; place-items:center start; gap:5px; width:100%; padding-bottom:3px; text-align:left;
  font:500 clamp(19px,1.27vw,25px)/1.2 var(--display); white-space:nowrap; text-shadow:inherit;
}
.guide-toggle svg {
  width:clamp(60px,4.6vw,88px); height:auto; filter:drop-shadow(1px 2px 1px #13232693);
}
.journal-frame { stroke:var(--hud-gold); stroke-opacity:.84; stroke-width:1.1; }
.journal-book { fill:#172d2caa; stroke-width:1.8; }
.journal-ink { stroke:var(--hud-gold); stroke-width:1.5; }
.view-controls { display:grid; justify-items:center; gap:8px; }
.view-controls button, .guide-close { display:grid; place-items:center; height:44px; width:44px; }
.view-controls button {
  width:clamp(49px,3.6vw,67px); height:clamp(49px,3.6vw,67px);
  border:1px solid var(--hud-line); border-radius:50%; background:#142b2b36;
  transition:color .2s ease,border-color .2s ease,background-color .2s ease;
}
.view-controls button[aria-pressed="true"] {
  color:var(--hud-gold); border-color:var(--hud-gold); background:#172f3188;
}
.stage-hint {
  position:absolute; z-index:3; left:50%; bottom:var(--hud-bottom); transform:translateX(-50%);
  margin:0; padding:6px 14px; border-radius:999px; pointer-events:none;
  font-size:13px; letter-spacing:.08em; white-space:nowrap;
  color:var(--hud-ink); background:color-mix(in srgb,var(--scrim) 52%,transparent);
  border:1px solid color-mix(in srgb,var(--hud-line) 70%,transparent);
  text-shadow:var(--hud-shadow); transition:opacity .2s ease;
}
.view-controls svg { width:clamp(29px,2.03vw,38px); height:auto; }
.guide-close svg { width:32px; height:32px; }

#season-guide {
  position:fixed; inset:auto auto var(--hud-bottom) calc(var(--hud-edge) + var(--hud-rail-width) + 16px); margin:0;
  width:min(450px,calc(100% - 2 * var(--hud-edge) - var(--hud-rail-width) - 16px)); max-width:none;
  max-height:calc(100dvh - 2 * var(--hud-bottom)); overflow:auto;
  padding:clamp(16px,2.05vw,27px); color:var(--hud-ink); background:#16292cf2;
  border:1px solid #d4b982a6; box-shadow:0 18px 50px #08171a66;
}
#season-guide::backdrop { background:#0e1b1f59; }
.guide-header { display:flex; align-items:start; justify-content:space-between; }
.guide-header p { margin:0 0 4px; font:500 15px/1.4 var(--display); letter-spacing:.12em; color:var(--hud-gold); }
#guide-meta { font:500 13px/1.4 var(--body-font); letter-spacing:.06em; color:var(--hud-muted); }
.guide-header h2 { margin:0; font:500 clamp(34px,3.8vw,50px)/1.15 var(--display); letter-spacing:.12em; }
.guide-close { margin:-7px -7px 0 0; }
.guide-verse {
  margin:12px 0 0; padding:4px 0 4px 11px; border-left:2px solid var(--hud-gold);
  font:500 15px/1.55 var(--body-font); color:var(--hud-gold); letter-spacing:.05em;
}
#term-note { margin:12px 0 14px; font:500 15.5px/1.8 var(--body-font); }
.phenology {
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;
  margin:0 0 16px; padding:10px 0;
  border-top:1px solid var(--hud-line); border-bottom:1px solid var(--hud-line);
}
.phenology div { display:grid; gap:3px; min-width:0; }
.phenology dt { font-size:12px; letter-spacing:.12em; color:var(--hud-gold); opacity:.9; }
.phenology dd { margin:0; font-size:14px; line-height:1.35; color:var(--hud-ink); }
.season-observations {
  display:grid; grid-template-columns:1fr 1fr; align-items:start; gap:12px;
  padding-top:2px;
}
.season-palette h3, .sundial figcaption { margin:0; font:500 17px/1.25 var(--display); white-space:nowrap; }
.swatches { display:flex; gap:8px; list-style:none; padding:0; margin:12px 0 0; }
.swatches li { display:grid; justify-items:start; gap:5px; font-size:14px; line-height:1.4; white-space:nowrap; }
.swatches i { width:2.1em; height:1.05em; background:var(--swatch); border:1px solid #fff6e066; box-shadow:0 1px 4px #07121455; }
.palette-caption { display:block; margin-top:9px; font-size:12.5px; letter-spacing:.08em; color:var(--hud-muted); }
.sundial { margin:0; padding-left:13px; border-left:1px solid var(--hud-line); display:grid; justify-items:start; }
.sun-diagram { display:block; width:100px; height:54px; }
#shadow-ratio { color:var(--hud-gold); font-size:15px; line-height:1.4; font-variant-numeric:lining-nums tabular-nums; }
.shadow-latitude { margin-top:4px; color:var(--hud-muted); font-size:12px; white-space:nowrap; }
.dial-axis { stroke:currentColor; opacity:.62; stroke-width:1; }
.gnomon { stroke:currentColor; stroke-width:2; }
.shadow { width:var(--shadow-length,4px); fill:var(--hud-gold); transition:width .28s; }
.sun { stroke:var(--hud-gold); stroke-width:1.4; fill:#fae3aa; transform:translate(var(--sun-position,8px),var(--sun-height,12px)); transition:transform .28s; }
.sun-ray { width:var(--ray-length,31px); fill:var(--hud-gold); transform:translate(32px,38px) rotate(var(--ray-angle,-132deg)); transition:width .28s,transform .28s; }

.stage {
  position:relative; isolation:isolate; min-height:100svh; overflow:hidden;
  background:var(--river);
}
.landscape { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#yard-shadow, #yard-hotspots { position:absolute; inset:0 0 50px; width:100%; height:calc(100% - 50px); pointer-events:none; overflow:visible; }
#plinth-shadow { fill:var(--plinth-shadow); opacity:.29; filter:blur(8px); transform:translate(7px,9px); }
.landscape-sun { opacity:.75; }
.landscape-mist { opacity:var(--mist-opacity); }
body[data-season="rain"] .landscape-sun,
body[data-season="winter"] .landscape-sun { visibility:hidden; }
#yard, #yard-compatibility { position:absolute; inset:0 0 50px; width:100%; height:calc(100% - 50px); display:block; }
#yard { touch-action:none; cursor:grab; }
#yard.gnomon-hover { cursor:pointer; }
#yard.dragging { cursor:grabbing; }
#yard-compatibility { pointer-events:none; }
#yard.compatibility-active { opacity:0; }
.stage:has(#yard.compatibility-active:focus-visible) { outline:2px solid var(--accent); outline-offset:-3px; }
.renderer-message { position:absolute; inset:43% 20px auto; text-align:center; }
#gnomon-target { position:absolute; pointer-events:none; opacity:0; padding:0; border:0; }
#yard-hotspots { --pole-stroke:3px; }
.stage:has(#yard.gnomon-hover,#gnomon-target:focus-visible) #yard-hotspots,
.exhibit.gnomon-focused #yard-hotspots { --pole-stroke:4.5px; }
#gnomon-outline, #gnomon-outline-edge { fill:none; stroke-linejoin:round; }
#gnomon-outline-edge { stroke:#352419; stroke-width:calc(var(--pole-stroke) + 2.5px); opacity:.86; }
#gnomon-outline { stroke:#ffe3a0; stroke-width:var(--pole-stroke); }
#gnomon-measure {
  display:none; stroke:#ffda8d; stroke-width:2; stroke-linecap:round;
  fill:none; filter:drop-shadow(0 1px 2px #1b2928);
}
.exhibit.gnomon-focused #gnomon-measure { display:block; }
.gnomon-inspect {
  position:absolute; z-index:3; left:50%; bottom:var(--hud-bottom); transform:translateX(-50%);
  width:min(448px,calc(100% - 2 * var(--hud-edge))); padding:14px 19px 16px;
  color:var(--hud-ink); background:#16292cf2; border:1px solid #d4b982a6;
  box-shadow:0 8px 28px #09191a44;
}
.gnomon-inspect header { display:flex; align-items:center; justify-content:space-between; }
.gnomon-inspect h2 { margin:0; font:500 21px/1.2 var(--display); letter-spacing:.1em; }
.gnomon-inspect button {
  display:grid; place-items:center; width:36px; height:36px; margin:-5px -8px 0 0;
  border:0; padding:0; background:transparent;
}
.gnomon-inspect button:hover { color:var(--hud-gold); }
.gnomon-inspect button svg {
  width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round;
}
.gnomon-inspect p { margin:6px 0 0; }
.gnomon-reading { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; color:var(--hud-muted); }
#gnomon-length { font:500 26px/1.25 var(--body-font); color:var(--hud-gold); font-variant-numeric:tabular-nums; }
.gnomon-altitude { margin-left:auto; font-size:14px; color:var(--hud-muted); font-variant-numeric:tabular-nums; }
#gnomon-altitude { color:var(--hud-ink); }
.season-interlude {
  --wash:#101e21;
  --tint:#d9e4bb;
  --dial-gold:#ffdf9d;
  --dial-turn:460ms;
  --dial-reveal:210ms;
  --interlude-fade:150ms;
  --travel:calc(var(--entry-direction,1) * clamp(48px,9svh,84px));
  position:fixed; z-index:4; inset:0;
  display:grid; place-items:center; padding:clamp(12px,3vw,36px);
  pointer-events:none;
  color:#fff8e9;
}
.season-interlude::before {
  content:"";
  position:absolute; inset:0;
  opacity:0;
  background-color:var(--wash);
  background-image:
    radial-gradient(circle at 18px 26px,#e5ead68c .6px,transparent 1.3px),
    radial-gradient(circle at 104px 52px,#b0c7d67d .5px,transparent 1.15px),
    radial-gradient(circle at 41px 70px,#f2ddbb7e .65px,transparent 1.5px),
    radial-gradient(circle at 187px 113px,#fff2ce96 .7px,transparent 1.7px),
    radial-gradient(ellipse at 32% 47%,#c4dfd91a,transparent 61%),
    linear-gradient(164deg,#070b14 0%,transparent 95%);
  background-size:115px 101px,173px 137px,89px 171px,257px 193px,100% 100%,100% 100%;
  transition:opacity 390ms ease,background-color 160ms ease;
}
.season-interlude[data-term="rain"] { --wash:#112331; --tint:#d2ecea; }
.season-interlude[data-term="dew"] { --wash:#2a1d20; --tint:#f4dfba; }
.season-interlude[data-term="winter"] { --wash:#15243b; --tint:#e2ecf5; }
.season-interlude[data-direction="backward"] { --entry-direction:-1; }
.season-interlude:is([data-phase="cover"],[data-phase="verse"])::before {
  opacity:1;
  transition-duration:130ms,135ms;
}
.interlude-landscape {
  position:absolute; inset:0; width:100%; height:100%;
  color:#0a131c; opacity:0; transition:opacity 350ms ease;
}
.season-interlude:is([data-phase="cover"],[data-phase="verse"]) .interlude-landscape { opacity:.78; transition-duration:160ms; }
.interlude-composition {
  position:relative; width:min(100%,1100px);
  display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center;
  gap:clamp(22px,5.2vw,92px);
}
.term-dial {
  width:min(49vw,74svh,590px); height:auto; overflow:visible;
  display:block; opacity:0; transform:scale(.95);
  transition:opacity 320ms ease,transform 380ms cubic-bezier(.22,.75,.23,1);
}
.season-interlude:is([data-phase="cover"],[data-phase="verse"]) .term-dial {
  opacity:1; transform:scale(1); transition-duration:var(--interlude-fade),460ms;
}
.dial-ring, .dial-minute-ring, .dial-hub-ring {
  fill:none; stroke:var(--tint);
}
.dial-ring { stroke-opacity:.68; }
.dial-minute-ring { stroke-opacity:.26; stroke-width:1.45; stroke-dasharray:1 10.52; }
.dial-hub-ring { stroke-opacity:.27; stroke-width:.85; }
.dial-hub { fill:#fff2cc; filter:drop-shadow(0 0 6px #ffe0a7a6); }
.dial-pointer { fill:var(--dial-gold); filter:drop-shadow(0 0 5px #ffdf9d8c); }
#dial-rotor, .dial-label {
  transition:transform var(--dial-turn) cubic-bezier(.24,.79,.26,1);
}
#dial-rotor { transform-origin:0 0; transform:rotate(var(--dial-angle,0deg)); }
.dial-diameters, .dial-chords, .dial-arc, .dial-track { fill:none; }
.dial-diameters { stroke:#c6dce0; stroke-width:.8; stroke-opacity:.35; }
.dial-fan { color:#f4e0b1; }
.dial-fan-cool { color:#b5d9ed; }
.dial-chords { stroke:currentColor; stroke-width:.8; stroke-opacity:.53; }
.dial-arc { stroke:currentColor; stroke-width:1.4; stroke-opacity:.92; }
.dial-tick { stroke:var(--tint); stroke-opacity:.6; }
.dial-node { fill:#182128; stroke:#dfebec; stroke-width:1.15; }
.dial-principal .dial-node { fill:#fdf0d5; stroke:#fdf0d5; }
.dial-anchor .dial-node { filter:drop-shadow(0 0 4px #f9e7b896); }
.dial-track { stroke:var(--dial-gold); stroke-width:1.65; opacity:0; }
.dial-label {
  fill:#dee6df; text-anchor:middle; dominant-baseline:central;
  font:500 17px var(--display);
  transform-box:fill-box; transform-origin:center; transform:rotate(calc(-1 * var(--dial-angle,0deg)));
}
.dial-featured .dial-tick { stroke-width:1.6; stroke-opacity:.9; }
.dial-featured .dial-label { fill:#fff8eb; }
.season-interlude:is([data-phase="verse"],[data-phase="exit"]) .dial-current .dial-track {
  animation:dial-trace 200ms ease-out var(--dial-reveal) both;
}
.season-interlude:is([data-phase="verse"],[data-phase="exit"]) .dial-current :is(.dial-label,.dial-node) {
  fill:var(--dial-gold);
  filter:drop-shadow(0 0 5px #ffd88b75);
  animation:dial-light 200ms ease-out var(--dial-reveal) both;
}
.season-interlude:is([data-phase="verse"],[data-phase="exit"]) .dial-current .dial-node { stroke:var(--dial-gold); }
.dial-current:not(.dial-principal) .dial-node { --node-rest:#182128; --node-highlight:#182128; }
@keyframes dial-trace { to { opacity:.9; } }
@keyframes dial-light {
  from { fill:var(--node-rest,#fff8eb); filter:drop-shadow(0 0 0 transparent); }
  to { fill:var(--node-highlight,var(--dial-gold)); filter:drop-shadow(0 0 5px #ffd88b75); }
}
.interlude-text {
  opacity:0;
  text-shadow:var(--ui-shadow);
}
.season-interlude:is([data-phase="cover"],[data-phase="verse"]) .interlude-text {
  opacity:1;
  transition:opacity var(--interlude-fade) ease;
}
.season-interlude[data-phase="exit"] .interlude-text {
  transform:translate(0,calc(-1 * var(--travel)));
  transition:opacity 320ms ease,transform 420ms cubic-bezier(.37,.02,.43,1);
}
.interlude-name {
  margin:0;
  font:500 clamp(55px,6vw,102px)/1.05 var(--display); letter-spacing:.17em;
}
.interlude-english {
  margin:10px 0 0; color:var(--tint);
  font:500 clamp(14px,1.45vw,17px)/1.3 var(--body-font); letter-spacing:.16em;
}
.interlude-longitude {
  margin:11px 0 0; color:var(--tint);
  font-size:clamp(13px,1.1vw,16px); letter-spacing:.12em;
  font-variant-numeric:lining-nums tabular-nums;
}
.interlude-verse {
  margin:24px 0 0;
  font:500 clamp(16px,1.7vw,25px)/1.7 var(--body-font); letter-spacing:.08em;
}
.interlude-verse::before {
  content:""; display:block; width:42px; height:1px;
  margin:0 0 17px; background:var(--tint); opacity:.55;
}
@media (max-width:720px) and (orientation:portrait) {
  .interlude-composition { grid-template-columns:1fr; justify-items:center; gap:clamp(12px,3svh,28px); }
  .term-dial { width:min(100%,57svh,430px); }
  .interlude-text { text-align:center; }
  .interlude-name { padding-inline-start:.17em; font-size:clamp(46px,12vw,70px); }
  .interlude-verse { margin-top:16px; }
  .interlude-verse::before { margin:0 auto 10px; }
}
@media (min-width:721px) and (max-width:1150px) {
  #yard, #yard-compatibility, #yard-shadow, #yard-hotspots { left:90px; width:calc(100% - 90px); }
}
@media (max-height:680px) and (min-width:721px) {
  :root { --hud-top:14px; --hud-bottom:14px; --ruler-step:20px; }
  .stage { min-height:max(515px,100svh); }
  .side-panel { row-gap:9px; }
  .mast h1 { font-size:36px; }
  .term[aria-current="true"] .term-name { font-size:23px; }
  .yard-links button { min-height:45px; font-size:14px; }
  .yard-links svg { width:22px; }
  .hud-toggle { height:43px; }
  .guide-toggle { font-size:17px; }
  .guide-toggle svg { width:49px; }
}
@media (max-width:720px) {
  .stage-hint { display:none; }
  :root { --hud-edge:clamp(14px,4.4vw,28px); --hud-top:19px; --hud-bottom:12px; --ruler-step:20px; }
  .stage { min-height:max(570px,100svh); }
  .exhibit::before {
    background:linear-gradient(180deg,#132527e8 0%,#13252798 25%,transparent 49%,transparent 68%,#132527e8 100%);
  }
  .side-panel { width:calc(100% - 2 * var(--hud-edge)); bottom:calc(var(--hud-bottom) + 53px); row-gap:14px; }
  .mast h1 { font-size:35px; }
  .calendar { width:min(100%,335px); }
  .ruler-heading { padding-bottom:5px; margin-bottom:3px; }
  .ruler-heading h2 { font-size:17px; }
  .ruler-window { width:min(180px,100%); }
  .yard-links { padding:3px 0 0; }
  .yard-links button { min-height:44px; display:flex; align-items:center; justify-content:center; gap:5px; font-size:13px; }
  .yard-links svg { width:16px; height:16px; }
  .season-note { align-self:end; padding-top:9px; }
  .season-note::before { top:17px; }
  #yard, #yard-compatibility, #yard-shadow, #yard-hotspots { inset:240px 0 90px; height:calc(100% - 330px); }
  .gnomon-inspect { bottom:calc(var(--hud-bottom) + 53px); }
  .hud-dock { width:auto; grid-auto-flow:column; align-items:center; gap:4px; }
  .hud-toggle { width:40px; height:44px; }
  .hud-toggle svg { width:27px; }
  .guide-toggle { display:flex; align-items:center; gap:5px; width:auto; min-height:44px; font-size:14px; }
  .guide-toggle svg { width:24px; height:24px; }
  .view-controls { display:flex; gap:3px; }
  .view-controls button { width:36px; height:36px; }
  .view-controls svg { width:21px; }
  #season-guide {
    inset:auto var(--hud-edge) calc(var(--hud-bottom) + 53px);
    width:min(420px,calc(100% - 2 * var(--hud-edge)));
    max-height:calc(100dvh - var(--hud-top) - var(--hud-bottom) - 53px);
  }
  .season-observations { gap:9px; }
  .sundial { padding-left:10px; }
}
@media (max-width:720px) and (max-height:710px) {
  .side-panel { row-gap:9px; }
  .ruler-window { height:calc(9 * var(--ruler-step)); }
  :root { --ruler-step:18px; }
  .term[aria-current="true"] .term-name { font-size:21px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; }
  .season-interlude { display:none; }
}

      [[.15,1.30,.12],[.85,2.47,-.42],[1.22,2.87,-.72],.67],
      [[.28,1.94,.11],[-.37,2.81,.66],[-.61,3.10,1.02],.76],
      [[.45,2.53,.08],[.33,3.21,-.28],[.63,3.70,-.24],.87],
      [[.33,2.20,.11],[1.12,2.75,.53],[1.63,3.08,.85],.71],
      [[.46,2.63,.08],[.87,3.36,.47],[1.01,3.54,.71],.68]
    ],
    broadleaf: [
      [[.11,1.70,.03],[.67,2.63,.66],[.91,3.24,1.03],.94],
      [[.30,2.02,.10],[-.40,2.72,.47],[-.48,3.21,.62],.76],
      [[.41,2.48,.09],[.99,3.26,-.35],[1.61,3.74,-.58],.95],
      [[.47,2.68,.10],[.17,3.58,-.50],[.34,4.03,-.87],.98],
      [[.44,2.55,.10],[.45,3.49,.42],[.68,4.12,.68],1.02]

  function bough(mesh, start, end, base, tip, bark) {
    const axes = [[1,0],[.5,.866],[-.5,.866],[-1,0],[-.5,-.866],[.5,-.866]];
    const ring = (point,radius) => axes.map(([x,z]) => [point[0]+x*radius,point[1],point[2]+z*radius]);
    const low = ring(start,base), high = ring(end,tip);
    for (let i=0;i<axes.length;i++) {
      const next=(i+1)%axes.length;
      mesh.face([low[i],high[i],high[next],low[next]],bark[i%bark.length]);
    }
  }

  function growTree(mesh, tree, term) {
    const {x,z,scale,lean,kind} = tree;
    const at = ([a,b,c]) => [x+a*scale*lean,.245+b*scale,z+c*scale];
    const bark = kind === "willow" ? ["74614b","887357","605245"] : ["745342","8b6850","624c41"];
    const stem = [[0,0,0],[.09,1.04,.03],[.29,1.96,.11],[.47,2.75,.10],[.50,3.14,.15]];
    const widths = [.27,.20,.15,.096,.037];
    for (let i=1;i<stem.length;i++) {
      bough(mesh,at(stem[i-1]),at(stem[i]),widths[i-1]*scale,widths[i]*scale,bark);
    }
    for (const [i,[start,bend,tip,size]] of branches[kind].entries()) {
      bough(mesh,at(start),at(bend),.115*scale,.056*scale,bark);
      bough(mesh,at(bend),at(tip),.062*scale,.020*scale,bark);
      for (const side of [-1,1]) {
        const twig = [tip[0]+side*.39,tip[1]+.29,tip[2]+side*.26];
        bough(mesh,at(bend),at(twig),.039*scale,.008*scale,bark);
      }
      if (term === "winter") {
        if (kind === "willow") {
          const sweep = [tip[0]+.17,tip[1]-.55,tip[2]+.13];
          mesh.beam(at(tip),at(sweep),.017*scale,.017*scale,bark[1]);
        }
        // Light snow dusting resting on upper bough forks.
        mesh.canopy(...at([bend[0],bend[1]+.09,bend[2]]),.16*scale,"f0f7fb",.36);
        mesh.canopy(...at([tip[0],tip[1]+.06,tip[2]]),.12*scale,"e4f0f7",.38);
        continue;
      }

      const willow = kind === "willow";
      const spread = term === "rain" ? (willow ? .78 : .76) : term === "dew" && willow ? .92 : 1.02;
      const palette = term === "rain" && !willow ? springBlossoms
        : term === "dew" && willow ? autumnWillow
        : treeLeaves[term];
      for (let j=0;j<8;j++) {
        const angle = j*2.4 + i*.72;
        const radius = j===0 ? 0 : size*(.43+.27*variation(i*17+j));
        const tuft = [tip[0]+Math.cos(angle)*radius,tip[1]+.16+variation(j+i*11)*.28,
          tip[2]+Math.sin(angle)*radius];
        const bulk = size*scale*spread*(j===0 ? 1 : .45+.25*variation(j*13+i));
        mesh.canopy(...at(tuft),bulk,palette[(i+j)%palette.length],willow ? .81 : 1.02);
        if (willow && j%2===0) {
          const droop = [tuft[0]+.14,tuft[1]-.68,tuft[2]+.1];
          mesh.beam(at(tuft),at(droop),.018*scale,.018*scale,palette[1]);
          mesh.canopy(...at(droop),bulk*.30,palette[2],2.6);
        }
      }
    }

    for (let i=0;i<5;i++) {
      const angle=i*2.4;
      bough(mesh,at([0,.19,0]),at([Math.cos(angle)*.40,.029,Math.sin(angle)*.46]),.11*scale,.025*scale,bark);
      const rock=at([Math.cos(angle)*.48,.017,Math.sin(angle)*.60]);
      mesh.canopy(...rock,(.12+variation(i)*.13)*scale,i%2 ? "9b957e" : "ada38b",.42);
    }
  }

  function leaf(mesh, x, y, z, size, heading, tilt, tone) {
    const dx=Math.cos(heading)*size, dz=Math.sin(heading)*size;
    const width=.42*Math.cos(tilt), bend=.42*Math.sin(tilt)*size;
    const tip=[x+dx,y,z+dz], stem=[x-dx*.7,y,z-dz*.7], rib=[x,y+.023,z];
    mesh.face([stem,rib,tip,[x-dz*width,y+bend,z+dx*width]],tone);
    mesh.face([stem,[x+dz*width,y-bend,z-dx*width],tip,rib],tone);
  }

  function stone(mesh, x, y, z, width, height, depth, face, edge) {
    const outline=[[-.50,-.31],[-.34,-.50],[.36,-.50],[.50,-.31],
      [.50,.34],[.36,.50],[-.35,.50],[-.50,.34]];
    const ring=(level,inset)=>outline.map(([dx,dz])=>[x+dx*width*inset,level,z+dz*depth*inset]);
    const bottom=ring(y-height/2,1), shoulder=ring(y+height*.22,1), top=ring(y+height/2,.88);
    mesh.face([...top].reverse(),face);
    for (let i=0;i<outline.length;i++) {
      const next=(i+1)%outline.length;
      mesh.face([bottom[i],shoulder[i],shoulder[next],bottom[next]],edge);
      mesh.face([shoulder[i],top[i],top[next],shoulder[next]],face);
    }
  }

  function platform(mesh, state) {
    const {left,right,back,front} = footprint;
    const cut=.32;
    const shape=[[left,back+cut],[left+cut,back],[right-cut,back],[right,back+cut],
      [right,front-cut],[right-cut,front],[left+cut,front],[left,front-cut]];
    const centerX=(left+right)/2, centerZ=(back+front)/2;
    const rings=[[-.87,.963],[-.73,.993],[-.42,.993],[-.34,1],[.12,1],[.24,.981]]
      .map(([y,scale]) => shape.map(([x,z]) => [centerX+(x-centerX)*scale,y,centerZ+(z-centerZ)*scale]));
    const strata = ["42372e","69503b","b49a6c","988569",state.grass];
    mesh.face([...rings.at(-1)].reverse(), state.ground);
    for (let j = 0; j < rings.length - 1; j++) {
      for (let i = 0; i < shape.length; i++) {
        const n = (i + 1) % shape.length;
        mesh.face([rings[j][i],rings[j + 1][i],rings[j + 1][n],rings[j][n]],strata[j]);
      }
    }
    const marks=(length) => Math.floor((length-.84)/.68);
    for (let i=0; i<marks(right-left); i++) {
      const x=left+.52+i*.68;
      const tone=["c6b598","ad9c82","bbac90","d3c0a0"][i%4];
      stone(mesh,x,-.11,front+.008,.61+variation(i)*.043,.27,.039,tone,"8c775e");
    }
    for (let i=0; i<marks(front-back); i++) {
      const z=back+.52+i*.68;
      const tone=["bdac91","aa9b84","c9b79a","b4a389"][i%4];
      stone(mesh,right+.008,-.11,z,.039,.27,.61+variation(i+40)*.041,tone,"897761");
      stone(mesh,left-.008,-.11,z,.039,.27,.61+variation(i+13)*.041,tone,"897761");
    }
  }

  function farmhouse(mesh, state, term) {
    // Three bays share a single ridge. Both roof planes extend beyond the bearing walls.
    const xmin = -1.95, xmax = 6.55, rear = -4.13, front = -.57;
    const cx = (xmin + xmax) / 2, cz = (rear + front) / 2;
    const walls = "f6eee0", beam = "5e3724", timber = "a15f38", footing = "988872";
    mesh.box(cx, .39, cz, 8.78, .30, 3.78, "bfb49c", footing);
    mesh.box(cx, 1.67, cz, 8.5, 2.28, 3.56, walls);
    mesh.box(cx,.645,front+.024,8.49,.22,.069,"aa9d81","968669");
    mesh.box(cx,2.61,front+.043,8.55,.18,.095,"865f43","6d4b36");
    for (let i=0; i<21; i++) {
      const x=xmin+.20+i*.407;
      mesh.box(x,.498,front+.113,.373,.112,.104,i%3===0 ? "b6a48a" : "9a8f7b");
    }
    for (let i=0; i<9; i++) {
      const z=rear+.23+i*.397;
      mesh.box(xmin-.04,.619,z,.12,.16,.38,i%2===0 ? "ad9b80" : "b8ab92");
      mesh.box(xmax+.04,.619,z,.12,.16,.38,i%2===0 ? "ad9b80" : "b8ab92");
    }
    mesh.box(cx,2.73,rear-.025,8.57,.15,.13,timber,beam);
    for (const x of [xmin+.32,2.3,xmax-.32]) mesh.box(x,1.67,rear-.028,.13,2.21,.11,timber,beam);
    for (const x of [-.71,5.22]) {
      mesh.box(x,1.68,rear-.075,.79,.68,.11,beam);
      for (let i=0;i<5;i++) mesh.box(x-.31+i*.155,1.68,rear-.139,.138,.56,.041,i%2 ? "ab8258" : "a27b54");
    }
    for (const x of [xmin, -.05, 2.94, 4.93, xmax]) mesh.box(x, 1.66, front + .048, .15, 2.25, .19, timber, beam);
    for (const x of [xmin, xmax]) {
      for (const z of [rear + .13, cz]) mesh.box(x, 1.70, z, .14, 2.32, .15, timber, beam);
      mesh.face([[x,2.81,rear],[x,2.81,front],[x,4.18,cz]], walls);
      mesh.face([[x,2.81,front],[x,2.81,rear],[x,4.18,cz]], walls);
      mesh.box(x, 2.78, cz, .15, .13, 3.60, timber, beam);
      mesh.box(x, 3.43, cz, .13, 1.36, .12, timber, beam);
    }

    const doorX = 2.27;
    mesh.box(doorX, 1.39, front + .085, 1.68, 1.83, .13, "613b26");
    for (let i = 0; i < 8; i++) {
      const x = doorX - .73 + i * .207;
      mesh.box(x, 1.39, front + .165, .196, 1.69, .066, i < 4 ? "b37243" : "c2814f");
    }
    for (const y of [.56, 2.26]) mesh.box(doorX, y, front + .219, 1.81, .12, .16, timber, beam);
    for (const x of [doorX - .84,doorX + .84]) mesh.box(x, 1.40, front + .205,.11,1.83,.12,timber,beam);
    for (const x of [doorX-.17,doorX+.17]) {
      mesh.box(x,1.35,front+.23,.087,.155,.045,"574538");
      mesh.beam([x-.027,1.36,front+.27],[x+.028,1.31,front+.274],.024,.022,"e6ba5e");
    }
    if (term === "rain" || term === "winter") {
      // Traditional red paper couplet strips and 45-degree rotated door diamond bring warm seasonal accent.
      for (const side of [-1,1]) {
        mesh.box(doorX + side*.94, 1.44, front + .17, .12, 1.24, .016, "c93e32");
      }
      mesh.box(doorX, 2.38, front + .21, .92, .13, .016, "c93e32");
      const dz = front + .216, dy = 1.70, r1 = .16, r2 = .072;
      mesh.face([[doorX,dy+r1,dz],[doorX-r1,dy,dz],[doorX,dy-r1,dz],[doorX+r1,dy,dz]],"cf4032");
      mesh.face([[doorX,dy+r2,dz+.006],[doorX-r2,dy,dz+.006],[doorX,dy-r2,dz+.006],[doorX+r2,dy,dz+.006]],"f4cd66");
    }
    mesh.box(doorX,2.40,front+.11,1.85,.16,.16,"7e5237");
    for (let i=0;i<6;i++) mesh.box(doorX-.72+i*.288,2.40,front+.21,.039,.096,.026,"c49560");
    const glowingWindow = term === "winter" || term === "rain";
    const paneColors = term === "winter" ? ["ffc65e","ffe292"]
      : term === "rain" ? ["f2be6b","fbd488"]
      : term === "dew" ? ["f0c778","fae09e"]
      : ["efe0bc","f8edd2"];
    for (const x of [-1.02, 4.24, 5.66]) {
      const width = x > 5 ? .68 : .97;
      mesh.box(x, 1.65, front + .067, width + .17, .86, .17, timber, beam);
      mesh.box(x,1.66,front+.163,width,.68,.037,"3e3129");
      mesh.emissive = glowingWindow;
      for (const side of [-1,1]) {
        const pane = x + side*width*.13;
        mesh.box(pane,1.67,front+.186,width*.21,.53,.015,side<0 ? paneColors[0] : paneColors[1]);
      }
      mesh.emissive = false;
      for (let i = -1; i <= 1; i++) mesh.box(x + i * width / 4,1.66,front + .196,.065,.68,.051,"c49864");
      mesh.box(x, 1.66, front + .192, width, .055, .053, "c49864");
      mesh.box(x, 1.26, front + .18, width + .24,.10,.29,"a57d55",beam);
    }
    mesh.box(xmax + .035, 1.6, -2.59, .12, .73, .88, beam);
    for (let i = 0; i < 5; i++) mesh.box(xmax + .105,1.6,-2.94 + i * .176,.045,.63,.155,"af8c65");

    mesh.box(cx, .356, -.24, 8.76,.225,.95, state.path, footing);
    stone(mesh,doorX,.315,.29,1.98,.15,.43,"bfb296","887862");
    stone(mesh,doorX,.273,.56,2.12,.068,.25,"ab9b7f","887862");
    mesh.box(cx, 2.53, .12, 8.73,.16,.21,timber,beam);
    for (const x of [xmin + .13, .37, 4.56, xmax - .13]) {
      mesh.box(x,.50,.12,.29,.17,.30,"a79a7e",footing);
      mesh.box(x,1.54,.12,.15,2.07,.15,timber,beam);
    }

    const roofX = [-2.37,6.99];
    const profile = [[-4.62,2.62],[-4.07,2.93],[-3.41,3.34],[-2.35,4.23],[-1.26,3.31],[-.47,2.79],[.56,2.60]];
    const tileSets = {
      rain: ["316470","3c727c","457f86","386a78","4f8a8e"],
      grain: ["325f70","3d6d7c","477985","396678","52858f"],
      dew: ["2c4a6b","36577a","406386","325273","4a6e90"],
      winter: ["273f5c","304b6a","395776","2c4664","436280"]
    };
    const tileTones = tileSets[term] || tileSets.grain;
    const roofHeight = z => {
      const i=profile.findIndex(([point]) => point>=z);
      if (i<1) return profile[i===0 ? 0 : profile.length-1][1];
      const [za,ya]=profile[i-1], [zb,yb]=profile[i];
      return ya+(yb-ya)*(z-za)/(zb-za);
    };
    const [a,b] = roofX;
    for (let i=0; i<profile.length-1; i++) {
      const [z0,y0]=profile[i], [z1,y1]=profile[i+1];
      mesh.face([[a,y0,z0],[a,y1,z1],[b,y1,z1],[b,y0,z0]],state.tile);
      mesh.face([[b,y0-.14,z0],[b,y1-.14,z1],[a,y1-.14,z1],[a,y0-.14,z0]],"734d34");
      for (const x of [a,b]) mesh.beam([x,y0-.052,z0],[x,y1-.052,z1],.119,.144,state.tile);
    }
    for (let column=0; column<44; column++) {
      const x=a+.108+column*(b-a-.216)/43;
      const width=.105;
      for (const [ridge,eave] of [[-2.35,.56],[-2.35,-4.62]]) {
        const direction=Math.sign(eave-ridge);
        const rows=Math.round(Math.abs(eave-ridge)/.21);
        for (let row=0; row<rows; row++) {
          const step=(eave-ridge)/rows;
          const z0=ridge+step*row, z1=ridge+step*(row+1);
          const y0=roofHeight(z0), y1=roofHeight(z1);
          const snowLine = .48 + .20*Math.sin(column*.25+direction) + .10*Math.cos(column*.67);
          const covered = term === "winter" && (row+.45)/rows < snowLine;
          const tone = covered ? "e8f2f8" : tileTones[Math.floor(variation(column*7+direction)*tileTones.length)];
          const glaze = covered ? "f4f9fc" : row%5===3 && variation(column+row*3)>.63 ? tileTones[4] : state.tile;
          const lip = covered ? ["bed4e3","cce0ec"] : ["364d59","2d424e"];
          const edges=[
            [[x-width,y0+.013,z0],[x-width,y1+.020,z1],[x,y1+.070,z1],[x,y0+.057,z0]],
            [[x,y0+.057,z0],[x,y1+.070,z1],[x+width,y1+.020,z1],[x+width,y0+.013,z0]]
          ];
          for (const [i,face] of edges.entries()) mesh.face(direction>0 ? face : face.reverse(),i===0 ? tone : glaze);
          const edge=.017*(row===rows-1 ? 2.4 : 1);
          mesh.face([[x-width,y1+.013-edge,z1+direction*.005],[x,y1+.063-edge,z1+direction*.005],[x,y1+.063,z1],[x-width,y1+.013,z1]],lip[0]);
          mesh.face([[x,y1+.063-edge,z1+direction*.005],[x+width,y1+.013-edge,z1+direction*.005],[x+width,y1+.013,z1],[x,y1+.063,z1]],lip[1]);
        }
      }
    }
    for (const [z,y] of [profile[0],profile.at(-1)]) mesh.beam([a,y-.084,z],[b,y-.084,z],.145,.12,"3a525e");
    mesh.beam([a-.025,4.285,cz],[b+.025,4.285,cz],.155,.174,"324c5c");
    for (let section=0;section<12;section++) {
      const x0=a+section*(b-a)/12, x1=a+(section+1)*(b-a)/12;
      const tone = term==="winter" ? "eff6fa" : section%3 ? tileTones[1] : tileTones[4];
      mesh.beam([x0+.023,4.37,cz],[x1-.023,4.37,cz],.14,.099,tone);
    }
    for (const x of [a+.11,b-.11]) {
      mesh.beam([x-.075,4.28,cz],[x+.075,4.28,cz],.20,.218,"6c8486");
    }
    for (let i=0; i<23; i++) {
      const x=a+.23+i*.40;
      mesh.beam([x,roofHeight(.24)-.17,.24],[x,roofHeight(.54)-.16,.54],.080,.078,"a36840");
    }

    mesh.revolved(5.40,.54,[[.24,.29],[.33,.37],[.72,.42],[.92,.36],[1.01,.34],[1.025,.28]],["9e5438","c4704a","b5603e","7d422c"]);
    mesh.revolved(5.40,.54,[[1.026,.27],[1.029,.265]],[state.water],16);
    mesh.box(6.04,.40,.76,.59,.30,.25,"ad7e50","8c613e");
    mesh.beam([6.2,.39,.25],[6.07,1.26,-.41],.07,.07,"b08452");
    mesh.box(-1.13,.46,.45,.82,.11,.35,"bd8e58","8f6642");
    for (const x of [-1.42,-.84]) mesh.box(x,.34,.45,.12,.21,.23,"8c6240");
    mesh.revolved(4.53,.31,[[.24,.16],[.29,.21],[.64,.26],[.69,.25]],["a07448","c4975c","a6804e"],10);
    for (const y of [.31,.54]) mesh.revolved(4.53,.31,[[y,.225],[y+.044,.228]],[ "70543a"],10);
    mesh.revolved(6.26,.88,[[.24,.23],[.31,.27],[.37,.26],[.39,.21]],["b58c52","d1ae6c","a28254"],12);

    // A small bamboo drying rack and a woven tray make the porch feel occupied.
    const trayX=.58, trayY=.85, trayZ=.28, trayR=.39;
    const at=(x,y)=>[trayX+x,trayY+y,trayZ-y*.30];
    const rim=Array.from({length:16},(_,i)=>{
      const angle=i*Math.PI/8;
      return at(trayR*Math.cos(angle),trayR*Math.sin(angle));
    });
    mesh.face(rim,term==="grain" ? "efc556" : "c49254");
    for (let i=0;i<rim.length;i++) mesh.beam(rim[i],rim[(i+1)%rim.length],.031,.025,"946038");
    for (let i=-4;i<=4;i++) {
      const y=i*.075, x=Math.sqrt(trayR*trayR-y*y)-.022;
      const left=at(-x,y), right=at(x,y);
      const weave = term==="grain" ? (i%2 ? "f7d772" : "dfb040") : (i%2 ? "d4a96a" : "9e7448");
      mesh.beam([left[0],left[1],left[2]+.019],[right[0],right[1],right[2]+.019],.013,.012,weave);
    }
    if (term==="dew") {
      // Bright orange-red persimmons drying on the porch tray.
      for (let i=0;i<7;i++) {
        const angle=i*2.4, r=i===0 ? 0 : .17;
        const p=at(Math.cos(angle)*r,Math.sin(angle)*r);
        mesh.canopy(p[0],p[1],p[2]+.045,.058,i%2 ? "eb632e" : "f58638",.8);
      }
    }
    for (const x of [3.61,4.21]) {
      mesh.beam([x,.24,.46],[x,.72,.33],.045,.045,"946b3e");
      mesh.beam([x,.24,.21],[x,.72,.33],.039,.039,"b3854c");
    }
    for (let i=0;i<5;i++) mesh.beam([3.55,.72,.25+i*.032],[4.27,.72,.25+i*.032],.027,.022,"ba8d50");
    for (const x of porchLanterns) {
      mesh.beam([x,2.53,.19],[x,2.05,.26],.017,.020,"75482e");
      mesh.revolved(x,.26,[[2.036,.088],[2.069,.087],[2.08,.038]],["8c452d","bd6e3e"],10);
      mesh.revolved(x,.26,[[1.775,.039],[1.80,.083],[1.818,.105]],["94422a","c45a36"],10);
      mesh.emissive = true;
      mesh.revolved(x,.26,[[1.816,.100],[1.854,.143],[1.906,.153],[1.969,.148],[2.036,.087]],
        ["eb5e2e","ff973b","ffdb73","ffa845"],10);
      mesh.emissive = false;
      mesh.beam([x,1.78,.26],[x,1.70,.268],.026,.024,"cc3c30");
    }
  }

  function blade(mesh, x, z, height, bend, tone) {
    const y = .282;
    const stem = [x,y,z], tip = [x+bend,y+height,z+.10];
    const center = [x+bend*.31,y+height*.45,z+.034];
    const width = height * .077;
    mesh.face([stem,[center[0]+width,center[1],center[2]],tip,[center[0]-width,center[1],center[2]]],tone);
    mesh.face([stem,[center[0],center[1],center[2]+width],tip,[center[0],center[1],center[2]-width]],tone);
  }

  function warmingPose(time) {

    const phase = time % farmerLoop;
    const moving = phase >= farmerMove;
    const hop = around(0,1,(phase - farmerMove - .09) / .44);
    const alternate = block % 2;
    const progress = alternate ? 1 - hop : hop;
    const lift = Math.sin(Math.PI * hop) * (term==="grain" ? .065 : .15);

      (velocity - omega * temp) * decay

  function viewMatrix(yaw,pitch,width,height,zoom,panX,panZ,pivotY) {

    const right=unit(cross([0,1,0],forward)), up=cross(forward,right);
    const span=Math.max(homeView.verticalSpan,orbitDiameter*height/(width*1.86))/zoom;

      right[1]*sx,up[1]*sy,-forward[1]/45,0,
      right[2]*sx,up[2]*sy,-forward[2]/45,0,
      -dot(right,target)*sx,
      -dot(up,target)*sy,

  function outlineHull(points) {
    const sorted=points.slice().sort(([ax,ay],[bx,by])=>ax-bx || ay-by);
    function rim(sequence) {
      const chain=[];
      for (const point of sequence) {
        while (chain.length>=2) {
          const [a,b]=chain.slice(-2);
          if ((b[0]-a[0])*(point[1]-a[1])>(b[1]-a[1])*(point[0]-a[0])) break;
          chain.pop();
        }
        chain.push(point);
      }
      return chain.slice(0,-1);
    }
    return [...rim(sorted),...rim(sorted.reverse())];

  function poleOccluded(vertices,forward) {
    const origin=[gnomon.x,gnomon.base+gnomon.height*.66,gnomon.z];
    const [x,y,z]=origin;
    for (let i=0;i<vertices.length;i+=27) {
      // The camera stays above the yard. Only test geometry in front of the pole.
      if (Math.max(vertices[i+1],vertices[i+10],vertices[i+19])<y) continue;
      if (forward[0]*(vertices[i]-x)<0 && forward[0]*(vertices[i+9]-x)<0 && forward[0]*(vertices[i+18]-x)<0) continue;
      if (forward[2]*(vertices[i+2]-z)<0 && forward[2]*(vertices[i+11]-z)<0 && forward[2]*(vertices[i+20]-z)<0) continue;
      const a=[vertices[i],vertices[i+1],vertices[i+2]];
      const e1=subtract([vertices[i+9],vertices[i+10],vertices[i+11]],a);
      const e2=subtract([vertices[i+18],vertices[i+19],vertices[i+20]],a);
      const p=cross(forward,e2), det=dot(e1,p);
      if (Math.abs(det)<1e-7) continue;
      const delta=[x-a[0],y-a[1],z-a[2]];
      const u=dot(delta,p)/det;
      if (u<0 || u>1) continue;
      const q=cross(delta,e1), v=dot(forward,q)/det;
      if (v>=0 && u+v<=1 && dot(e2,q)/det>.13) return true;
    }
    return false;

  const lightGrid = {size:512,left:-7,back:-7,width:25,depth:32};

  // Store the highest surface along each light ray and each vertical ray.
  // The same light map serves WebGL and the Canvas fallback.
  function rasterLight(vertices, pixels, channel, shearX, shearZ) {
    const {size,left,back,width,depth}=lightGrid;
    const scaleX=size/width, scaleZ=size/depth;
    for (let i=0;i<vertices.length;i+=27) {
      const ay=vertices[i+1], by=vertices[i+10], cy=vertices[i+19];
      const ax=(vertices[i]-ay*shearX-left)*scaleX;
      const az=(vertices[i+2]-ay*shearZ-back)*scaleZ;
      const bx=(vertices[i+9]-by*shearX-left)*scaleX;
      const bz=(vertices[i+11]-by*shearZ-back)*scaleZ;
      const cx=(vertices[i+18]-cy*shearX-left)*scaleX;
      const cz=(vertices[i+20]-cy*shearZ-back)*scaleZ;
      const minX=Math.max(0,Math.ceil(Math.min(ax,bx,cx)-.5));
      const maxX=Math.min(size-1,Math.floor(Math.max(ax,bx,cx)-.5));
      const minZ=Math.max(0,Math.ceil(Math.min(az,bz,cz)-.5));
      const maxZ=Math.min(size-1,Math.floor(Math.max(az,bz,cz)-.5));
      if (minX>maxX || minZ>maxZ) continue;
      const det=(bx-ax)*(cz-az)-(bz-az)*(cx-ax);
      if (Math.abs(det)<.0001) continue;
      const du=(cz-az)/det, dv=(az-bz)/det;
      for (let z=minZ;z<=maxZ;z++) {
        const offsetX=minX+.5-ax, offsetZ=z+.5-az;
        let u=(offsetX*(cz-az)-offsetZ*(cx-ax))/det;
        let v=((bx-ax)*offsetZ-(bz-az)*offsetX)/det;
        for (let x=minX,p=(z*size+x)*4+channel;x<=maxX;x++,p+=4,u+=du,v+=dv) {
          if (u<0 || v<0 || u+v>1) continue;
          const encoded=Math.round((ay+u*(by-ay)+v*(cy-ay)+1)*32);
          if (encoded>pixels[p]) pixels[p]=Math.min(255,encoded);
        }
      }
    }
  }

  function lightMap(world, shadowRatio, term) {
    const shearX=sunHeading[0]*shadowRatio, shearZ=sunHeading[1]*shadowRatio;
    const {size}=lightGrid;
    const pixels=new Uint8Array(size*size*4);
    rasterLight(world,pixels,0,shearX,shearZ);
    rasterLight(world,pixels,1,0,0);
    // Expand nearby blockers by two texels so contact shadows hug the edges of objects.
    const stride=size*4;
    for (let z=0;z<size;z++) {
      const above=Math.max(0,z-2)*stride, below=Math.min(size-1,z+2)*stride;
      const row=z*stride;
      for (let x=0;x<size;x++) {
        const column=x*4+1, p=row+column;
        const near=Math.max(pixels[above+column],pixels[below+column],
          pixels[row+Math.max(0,x-2)*4+1],pixels[row+Math.min(size-1,x+2)*4+1]);
        pixels[p+1]=Math.max(pixels[p],near-4);
      }
    }
    const lantern=lanternStrength[term];
    const palette=seasonColors[term];
    return {pixels,shearX,shearZ,opacity:shadeOpacity[term],sun:unit([shearX,1,shearZ]),
      sunTint:palette.sunTint,shadowTint:palette.shadowTint,
      haze:color(hazeColor[term]),practicalPower:[lantern,lantern*.88,term==="winter" ? 1.95 : 0]};
  }

  function practicalGlow(x,y,z,nx,ny,nz,power,farmer) {
    let total=0;
    for (let i=0;i<practicalLights.length;i++) {
      if (!power[i]) continue;
      const [lx,ly,lz,radius]=practicalLights[i];
      const dx=lx-x,dy=ly-y,dz=lz-z;
      const distance2=dx*dx+dy*dy+dz*dz;
      const falloff=1-distance2/(radius*radius);
      if (falloff<=0) continue;
      const facing=farmer ? .68 : .26+.74*Math.max(0,(nx*dx+ny*dy+nz*dz)/Math.sqrt(Math.max(distance2,.015)));
      total+=falloff*falloff*power[i]*facing;
    }
    return total;
  }

  function shaderProgram(gl, api) {

      ${modern ? "in" : "attribute"} vec3 position, normal, pigment;

      ${modern ? "out" : "varying"} mediump vec3 tint, faceNormal, worldPosition;
      ${modern ? "out" : "varying"} mediump float viewDepth;

        float glow=${practicalLights.map(([x,y,z,radius],i)=>
          `lamp(p,n,vec3(${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}),${radius.toFixed(3)},practicalPower.${"xyz"[i]},actor)`
        ).join("+")};
        vec2 ray = lightUV(p.xz-shadowInfo.xy*p.y);

        float height=p.y+0.068;

        float grain = sin(p.x*44.0+sin(p.z*9.0))*sin(p.z*37.0+sin(p.y*13.0));
        float textureMod = 1.0;

        if (p.y>0.4 && p.y<2.7 && tint.r-tint.g>0.11) {
          textureMod *= 1.0+sin((p.x+p.z)*65.0+cos(p.y*6.0))*0.036;

        if (waterPass>0.5) {
          float wave = sin(p.z*15.0+cos(p.x*2.8)*0.85+waterTime*2.0);
          float ripple = smoothstep(0.89,0.99,wave)*(0.35+0.65*sin(p.x*3.8+waterTime*0.65)*sin(p.x*3.8));

      gl.attachShader(program,shader);

  function blendFarmerPixel(behind,r,g,b,alpha) {
    const transmitted=(behind>>>24)/255*(1-alpha);
    const coverage=alpha+transmitted;
    const mix=(channel,shift)=>Math.round(around(0,255,
      (channel*alpha+((behind>>>shift)&255)*transmitted)/coverage
    ));
    return (Math.round(coverage*255)<<24)|(mix(b,16)<<16)|(mix(g,8)<<8)|mix(r,0);
  }

  class CanvasYardRenderer {
    constructor(canvas) {
      this.canvas = canvas;
      this.context = canvas.getContext("2d");
      if (!this.context) throw Error("Canvas 2D unavailable");
    }

    render(matrix, cssWidth, cssHeight, world, actor, water, warmth, light, farmer) {
      const scale = Math.min(1,Math.sqrt(920000/(cssWidth*cssHeight)));
      const width = Math.max(1,Math.round(cssWidth*scale));
      const height = Math.max(1,Math.round(cssHeight*scale));
      if (!this.frame || this.canvas.width !== width || this.canvas.height !== height) {
        this.canvas.width = width;
        this.canvas.height = height;
        this.frame = this.context.createImageData(width,height);
        this.pixels = new Uint32Array(this.frame.data.buffer);
        this.depth = new Float32Array(width*height);
        this.worldPixels = new Uint32Array(width*height);
        this.worldDepth = new Float32Array(width*height);
        this.waterPixels = new Uint32Array(width*height);
        this.waterDepth = new Float32Array(width*height);
        this.world = null;
      }
      if (this.world !== world || this.matrix !== matrix) {
        this.pixels.fill(0);
        this.depth.fill(Infinity);
        this.draw(world,matrix,warmth,light);
        this.worldDepth.set(this.depth);
        this.waterDepth.fill(Infinity);
        if (water.length) this.draw(water,matrix,warmth,light,"water");
        this.world = world;
        this.matrix = matrix;
        this.worldPixels.set(this.pixels);
      }
      this.pixels.set(this.worldPixels);
      this.depth.set(this.worldDepth);
      if (farmer) this.draw(farmer.shadow.data,matrix,warmth,light,"farmer-shadow",farmer.texture);
      this.draw(actor,matrix,warmth,light,water.length ? "actor" : "solid");
      if (farmer) this.draw(farmer.sprite.data,matrix,warmth,light,"farmer",farmer.texture);
      this.context.putImageData(this.frame,0,0);
    }

    draw(vertices,m,warmth,light,layer="solid",texture) {
      const {width,height} = this.canvas;
      const halfWidth = width/2, halfHeight = height/2;
      const [sunX,sunY,sunZ] = light.sun;
      const {size,left:lightLeft,back:lightBack,width:lightWidth,depth:lightDepth}=lightGrid;
      const lightX=size/lightWidth, lightZ=size/lightDepth;
      const readLight=(x,z,channel)=>light.pixels[
        (around(0,size-1,Math.floor(z))*size+around(0,size-1,Math.floor(x)))*4+channel
      ]/32-1;
      const {pixels,depth,waterDepth,waterPixels} = this;
      for (let i=0;i<vertices.length;i+=27) {
        const x0=vertices[i], y0=vertices[i+1], z0=vertices[i+2];
        const x1=vertices[i+9], y1=vertices[i+10], z1=vertices[i+11];
        const x2=vertices[i+18], y2=vertices[i+19], z2=vertices[i+20];
        const ax=(x0*m[0]+y0*m[4]+z0*m[8]+m[12]+1)*halfWidth;
        const ay=(1-x0*m[1]-y0*m[5]-z0*m[9]-m[13])*halfHeight;
        const az=x0*m[2]+y0*m[6]+z0*m[10]+m[14];
        const bx=(x1*m[0]+y1*m[4]+z1*m[8]+m[12]+1)*halfWidth;
        const by=(1-x1*m[1]-y1*m[5]-z1*m[9]-m[13])*halfHeight;
        const bz=x1*m[2]+y1*m[6]+z1*m[10]+m[14];
        const cx=(x2*m[0]+y2*m[4]+z2*m[8]+m[12]+1)*halfWidth;
        const cy=(1-x2*m[1]-y2*m[5]-z2*m[9]-m[13])*halfHeight;
        const cz=x2*m[2]+y2*m[6]+z2*m[10]+m[14];
        const left=Math.max(0,Math.ceil(Math.min(ax,bx,cx)-.5));
        const right=Math.min(width-1,Math.floor(Math.max(ax,bx,cx)-.5));
        const top=Math.max(0,Math.ceil(Math.min(ay,by,cy)-.5));
        const bottom=Math.min(height-1,Math.floor(Math.max(ay,by,cy)-.5));
        if (left>right || top>bottom) continue;
        const det=(bx-ax)*(cy-ay)-(cx-ax)*(by-ay);
        if (Math.abs(det)<.0001) continue;

        const nx=vertices[i+3], ny=vertices[i+4], nz=vertices[i+5];
        const diffuse=Math.max(0,nx*sunX+ny*sunY+nz*sunZ);
        const ambient=.49+.08*(vertices[i+4]+1);
        const direct=.10+.35*diffuse;
        const red=vertices[i+6]*warmth[0]*255;
        const green=vertices[i+7]*warmth[1]*255;
        const blue=vertices[i+8]*warmth[2]*255;
        const flake=vertices[i+6]>.93 && vertices[i+7]>.95 && vertices[i+8]>.963;
        const emissive=vertices[i+6]<0 && !texture;
        const emitted=(255<<24)|(Math.round(-vertices[i+8]*255)<<16)|
          (Math.round(-vertices[i+7]*255)<<8)|Math.round(-vertices[i+6]*255);

        const du=(cy-ay)/det, dv=(ay-by)/det;
        for (let y=top;y<=bottom;y++) {
          const offsetY=y+.5-ay, offsetX=left+.5-ax;
          let u=(offsetX*(cy-ay)-offsetY*(cx-ax))/det;
          let v=((bx-ax)*offsetY-(by-ay)*offsetX)/det;
          for (let x=left,p=y*width+left;x<=right;x++,p++,u+=du,v+=dv) {
            if (u<0 || v<0 || u+v>1) continue;
            const z=az+u*(bz-az)+v*(cz-az);
            if (z>=depth[p]) continue;
            if (emissive) {
              depth[p]=z;
              pixels[p]=emitted;
              continue;
            }
            let texel;
            if (texture) {
              const tx=vertices[i+6]+u*(vertices[i+15]-vertices[i+6])+v*(vertices[i+24]-vertices[i+6]);
              const ty=vertices[i+7]+u*(vertices[i+16]-vertices[i+7])+v*(vertices[i+25]-vertices[i+7]);
              texel=(Math.floor(ty*texture.height)*texture.width+Math.floor(tx*texture.width))*4;
              const alpha=texture.data[texel+3]/255;
              if (alpha<.025) continue;
              if (layer==="farmer-shadow") {
                pixels[p]=blendFarmerPixel(pixels[p],33,43,43,alpha*vertices[i+5]);
                continue;
              }
            }
            const worldX=x0+u*(x1-x0)+v*(x2-x0);
            const worldY=y0+u*(y1-y0)+v*(y2-y0);
            const worldZ=z0+u*(z1-z0)+v*(z2-z0);
            const lx=(worldX-lightLeft)*lightX, lz=(worldZ-lightBack)*lightZ;
            const blocker=readLight(lx-worldY*light.shearX*lightX,lz-worldY*light.shearZ*lightZ,0);
            const overhead=readLight(lx,lz,2)-worldY;
            const contact=around(0,1,(overhead-.055)/.135)*(1-.67*around(0,1,(overhead-.18)/1.47));
            const cast=blocker>=worldY+.068 ? light.opacity : 0;
            const glow=practicalGlow(worldX,worldY,worldZ,nx,ny,nz,light.practicalPower,Boolean(texture));
            if (texture) {
              const brightness=.97-.29*cast-.12*contact;
              const mist=around(0,.055,(z-.12)*.25);
              const surface=waterPixels[p], opacity=z>waterDepth[p] ? shallowWater.opacity : 0;
              const tex=texture.data;
              const channels=[0,1,2].map(i =>
                ((tex[texel+i]*warmth[i]*brightness+(tex[texel+i]*.62+23)*practicalTint[i]*glow)*(1-mist)
                  +light.haze[i]*255*mist)*(1-opacity) +
                ((surface>>>(i*8))&255)*opacity
              );
              pixels[p]=blendFarmerPixel(pixels[p],...channels,tex[texel+3]/255);
              depth[p]=z;
              continue;
            }
            const amb=ambient*(1-.32*contact), dir=direct*(1-cast);
            const mist=around(0,.05,(z-.12)*.25);
            const fogScale=255*mist, clear=1-mist;
            const lamp=glow*clear;
            const ambMix=.36+.34*((ny+1)*.5);
            const st=light.shadowTint, sn=light.sunTint;
            let r=red*(amb*(st[0]+(1-st[0])*ambMix)+dir*sn[0]);
            let g=green*(amb*(st[1]+(1-st[1])*ambMix)+dir*sn[1]);
            let b=blue*(amb*(st[2]+(1-st[2])*ambMix)+dir*sn[2]);
            const luma=r*.299+g*.587+b*.114;
            r=luma+(r-luma)*1.11; g=luma+(g-luma)*1.11; b=luma+(b-luma)*1.11;
            if (flake) {
              const sf=cast*.75;
              r=r*.24+vertices[i+6]*255*(1.02*(1-sf)+.79*sf)*.76;
              g=g*.24+vertices[i+7]*255*(1.02*(1-sf)+.89*sf)*.76;
              b=b*.24+vertices[i+8]*255*(1.01*(1-sf)+1.04*sf)*.76;
            }
            r=around(0,255,r*clear+light.haze[0]*fogScale+(vertices[i+6]*142.8+43)*practicalTint[0]*lamp);
            g=around(0,255,g*clear+light.haze[1]*fogScale+(vertices[i+7]*142.8+43)*practicalTint[1]*lamp);
            b=around(0,255,b*clear+light.haze[2]*fogScale+(vertices[i+8]*142.8+43)*practicalTint[2]*lamp);
            let coverage=1;
            if (layer==="water") {
              waterDepth[p]=z;
              waterPixels[p]=(Math.round(b)<<16)|(Math.round(g)<<8)|Math.round(r);
              const behind=pixels[p];
              const opacity=shallowWater.opacity;
              const transmitted=(behind>>>24)/255*(1-opacity);
              coverage=opacity+transmitted;
              r=(r*opacity+(behind&255)*transmitted)/coverage;
              g=(g*opacity+((behind>>>8)&255)*transmitted)/coverage;
              b=(b*opacity+((behind>>>16)&255)*transmitted)/coverage;
            } else if (layer==="actor" && z>waterDepth[p]) {
              const surface=waterPixels[p], a=shallowWater.opacity;
              r=r*(1-a)+(surface&255)*a;
              g=g*(1-a)+((surface>>>8)&255)*a;
              b=b*(1-a)+((surface>>>16)&255)*a;
            }
            depth[p]=z;
            pixels[p]=(Math.round(coverage*255)<<24)|(Math.round(b)<<16)|(Math.round(g)<<8)|Math.round(r);
          }
        }
      }
    }
  }

  class YardScene {
    constructor(canvas, compatibilityCanvas, plinthShadow, farmerAtlas) {
      this.canvas = canvas;
      this.compatibilityCanvas = compatibilityCanvas;
      this.plinthShadow = plinthShadow;
      this.world = {handle:null,data:null};
      this.actor = {handle:null,data:null};
      this.actorMesh = new Mesh();
      this.farmerAtlas = farmerAtlas;
      this.farmerSprite = {handle:null,data:new Float32Array(54),count:6};
      this.farmerShadow = {handle:null,data:new Float32Array(54),count:6};
      farmerAtlas?.addEventListener("load",() => this.invalidateView(),{once:true});
      this.onFrame = time => this.loop(time);
      try {
        const options={antialias:true,alpha:true,powerPreference:"high-performance",failIfMajorPerformanceCaveat:true};
        for (const api of ["webgl2","webgl"]) {
          const gl=canvas.getContext(api,options);
          if (!gl) continue;
          this.gpuContext=gl;
          this.gpuApi=api;
          break;
        }
        if (!this.gpuContext) throw Error("Hardware WebGL unavailable");
        this.initializeGraphics(this.gpuContext);
      } catch (error) {
        this.useSoftwareRenderer(error);
      }
      canvas.addEventListener("webglcontextlost", event => {
        event.preventDefault();
        this.useSoftwareRenderer(Error("WebGL context lost"));
        this.render();
      });
      canvas.addEventListener("webglcontextrestored", () => {
        try {
          this.initializeGraphics(this.gpuContext);
          if (this.state) {
            this.uploadGpuBuffer(this.world,false);
            this.uploadGpuBuffer(this.actor,true);
            this.uploadShadows();
          }
          this.software=null;
          this.compatibilityCanvas.hidden=true;
          this.canvas.classList.remove("compatibility-active");
          this.frameSample=undefined;
          delete this.canvas.dataset.frameRate;
        } catch (error) {
          this.useSoftwareRenderer(error);
        }
        this.render();
      });
      const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
      this.motion = !motionPreference.matches;
      motionPreference.addEventListener?.("change", () => {
        this.motion = !motionPreference.matches;
        this.lastActorFrame = undefined;
        if (this.motion) this.queueFrame();
        else {
          delete this.canvas.dataset.frameRate;
          if (this.targetView) this.applyViewImmediate(this.targetView);
          if (this.state) this.act(0,0);
          this.invalidateView();
        }
      });
      this.reset(true);
      if (typeof ResizeObserver === "function") {
        const observer = new ResizeObserver(() => this.invalidateView());
        observer.observe(canvas);
      } else {
        window.addEventListener("resize", () => this.invalidateView());
      }
    }

    initializeGraphics(gl) {
      const program = shaderProgram(gl,this.gpuApi);
      this.gl = gl;
      gl.useProgram(program);
      this.locations = ["position","normal","pigment"].map(name => gl.getAttribLocation(program,name));
      this.camera = gl.getUniformLocation(program,"camera");
      this.warmth = gl.getUniformLocation(program,"warmth");
      this.sunTint = gl.getUniformLocation(program,"sunTint");
      this.shadowTint = gl.getUniformLocation(program,"shadowTint");
      this.practicalPower = gl.getUniformLocation(program,"practicalPower");
      this.shadowInfo = gl.getUniformLocation(program,"shadowInfo");
      this.hazeTint = gl.getUniformLocation(program,"hazeTint");
      this.waterPass = gl.getUniformLocation(program,"waterPass");
      this.waterTime = gl.getUniformLocation(program,"waterTime");
      this.shadowTexture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,this.shadowTexture);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      this.world.handle = gl.createBuffer();
      this.actor.handle = gl.createBuffer();
      if (this.farmerAtlas) {
        this.farmerPass = gl.getUniformLocation(program,"farmerPass");
        this.farmerSampler = gl.getUniformLocation(program,"farmerTexture");
        this.farmerSprite.handle = gl.createBuffer();
        this.farmerShadow.handle = gl.createBuffer();
        this.farmerTexture = null;
      }
      gl.clearColor(0,0,0,0);
      gl.enable(gl.DEPTH_TEST);
      gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
      const attributes = gl.getContextAttributes?.();
      const debug = gl.getExtension?.("WEBGL_debug_renderer_info");
      this.canvas.dataset.renderer = this.gpuApi==="webgl2" ? "WebGL 2" : "WebGL 1";
      this.canvas.dataset.antialias = attributes ? String(attributes.antialias) : "unknown";
      if (debug) this.canvas.dataset.renderDevice = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
    }

    useSoftwareRenderer(error) {
      this.software ??= new CanvasYardRenderer(this.compatibilityCanvas);
      this.gl = null;
      this.compatibilityCanvas.hidden = false;
      this.canvas.classList.add("compatibility-active");
      this.canvas.dataset.renderer = "Canvas 2D";
      this.canvas.dataset.antialias = "false";
      delete this.canvas.dataset.renderDevice;
      delete this.canvas.dataset.frameRate;
      this.frameSample = undefined;

      }
      const farmerReady=this.prepareFarmer();
      if (this.software) {
        const farmer=farmerReady && {shadow:this.farmerShadow,sprite:this.farmerSprite,texture:this.farmerPixels};
        this.software.render(matrix,clientWidth,clientHeight,this.landData,this.actor.data,this.waterData,
          this.state.light,this.shadows,farmer);
        return;
      }
      const gl = this.gl;
      const ratio = Math.max(1,Math.min(devicePixelRatio || 1,2,Math.sqrt(2400000/(clientWidth*clientHeight))));
      const width = Math.max(1,Math.round(clientWidth*ratio)), height = Math.max(1,Math.round(clientHeight*ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      gl.viewport(0,0,width,height);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.uniformMatrix4fv(this.camera,false,matrix);
      gl.uniform3fv(this.shadowInfo,[this.shadows.shearX,this.shadows.shearZ,this.shadows.opacity]);
      gl.uniform3fv(this.hazeTint,this.shadows.haze);
      gl.uniform3fv(this.warmth,this.state.light);
      gl.uniform3fv(this.sunTint,this.state.sunTint);
      gl.uniform3fv(this.shadowTint,this.state.shadowTint);
      gl.uniform3fv(this.practicalPower,this.lampPower);
      gl.uniform1f(this.waterTime,this.sceneTime || 0);
      gl.uniform1f(this.waterPass,0);
      this.draw(this.world,0,this.landCount);
      if (farmerReady) {
        this.uploadGpuBuffer(this.farmerShadow,true);
        gl.enable(gl.BLEND);
        gl.depthMask(false);
        gl.uniform1f(this.farmerPass,2);
        this.draw(this.farmerShadow);
        gl.uniform1f(this.farmerPass,0);
        gl.depthMask(true);
        gl.disable(gl.BLEND);
      }
      this.draw(this.actor);
      if (farmerReady) {
        this.uploadGpuBuffer(this.farmerSprite,true);
        gl.enable(gl.BLEND);
        gl.uniform1f(this.farmerPass,1);
        this.draw(this.farmerSprite);
        gl.uniform1f(this.farmerPass,0);
        gl.disable(gl.BLEND);
      }
      if (this.waterData.length) {
        gl.enable(gl.BLEND);
        gl.uniform1f(this.waterPass,1);
        this.draw(this.world,this.landCount,this.world.count-this.landCount);
        gl.disable(gl.BLEND);
      }
    }
    loop(time) {
      this.frameQueued = false;
      if (!this.state) return;
      this.stepCamera(time);
      const animate=this.motion && (!this.software || this.lastActorFrame===undefined || time-this.lastActorFrame>=32);
      if (animate) {
        this.lastActorFrame=time;
        this.farmerStart ??= time;
        this.act(time/1000,(time-this.farmerStart)/1000);
      }
      if (animate || this.cameraDirty) this.render();
      if (!this.motion) return;
      const sample=this.frameSample ??= {start:time,frames:0};
      if (animate) sample.frames++;
      if (time-sample.start>=1000) {
        this.canvas.dataset.frameRate=(sample.frames*1000/(time-sample.start)).toFixed(1);
        this.frameSample={start:time,frames:0};
      }
      this.queueFrame();
    }
  }
  window.YardScene = YardScene;
})();

  const stops = buttons.map(button => marks.indexOf(button));
  const note = document.querySelector("#term-note");
  const summary = document.querySelector("#term-summary");
  const guide = document.querySelector("#season-guide");
  const guideMeta = document.querySelector("#guide-meta");
  const guideTerm = document.querySelector("#guide-term");
  const guideVerse = document.querySelector("#guide-verse");
  const houNodes = ["#hou-1","#hou-2","#hou-3"].map(selector => document.querySelector(selector));
  const paletteCaption = document.querySelector("#palette-caption");
  const openGuide = document.querySelector("#open-guide");
  const exhibit = document.querySelector(".exhibit");
  const hudToggle = document.querySelector("#hud-toggle");
  const hotspotLayer = document.querySelector("#yard-hotspots");
  const poleOutline = document.querySelector("#gnomon-outline");
  const poleOutlineEdge = document.querySelector("#gnomon-outline-edge");
  const poleMeasure = document.querySelector("#gnomon-measure");
  const poleTarget = document.querySelector("#gnomon-target");
  const poleInspection = document.querySelector("#gnomon-inspect");
  const poleReading = document.querySelector("#gnomon-length");
  const poleAltitude = document.querySelector("#gnomon-altitude");
  const poleNote = document.querySelector("#gnomon-note");
  const poleReturn = document.querySelector("#gnomon-return");
  const gnomonToggle = document.querySelector("#toggle-gnomon");
  const interlude = document.querySelector("#season-interlude");
  const interludeText = document.querySelector(".interlude-text");
  const interludeName = document.querySelector("#interlude-name");
  const interludeEnglish = document.querySelector("#interlude-english");
  const interludeLongitude = document.querySelector("#interlude-longitude");
  const interludeVerse = document.querySelector("#interlude-verse");
  const dialRotor = document.querySelector("#dial-rotor");
  const dialFans = document.querySelector("#dial-fans");

  const degrees = Math.PI / 180;

  const fanStart = dialNames.indexOf("小满");

  function dialPoint(index, radius) {
    const angle = index * dialStep * degrees;
    return [Math.sin(angle) * radius, -Math.cos(angle) * radius].map(value => Math.round(value * 100) / 100);
  }

  function svgElement(tag, attributes) {
    const element = document.createElementNS("http://www.w3.org/2000/svg",tag);
    for (const [name,value] of Object.entries(attributes)) element.setAttribute(name,value);
    return element;
  }

  // Draw two opposite fans, anchored by 小满 (60°) and 小雪 (240°).
  // Each dot lies on a 15° spoke, at its intersection with the corresponding fan chord.
  // A 10° offset on the rim separates the two sets of lines and sets the shape of the arcs.
  const fanOffset = 10 / dialStep;
  function fanRadius(offset) {
    const chordAngle = (offset + fanOffset) * dialStep * degrees / 2;
    const spokeAngle = offset * dialStep * degrees;
    return dialRadius * Math.cos(chordAngle) / Math.cos(spokeAngle - chordAngle);
  }

  const diameters = [];
  for (let index = 0; index < halfYear; index++) {
    diameters.push(`M${dialPoint(index,dialRadius).join(" ")} L${dialPoint(index + halfYear,dialRadius).join(" ")}`);
  }
  document.querySelector("#dial-diameters").setAttribute("d",diameters.join(" "));

  for (const [half,anchor] of [fanStart,fanStart + halfYear].entries()) {
    const origin = dialPoint(anchor,dialRadius).join(" ");
    const chords = [];
    const curve = [];
    for (let offset = 0; offset < halfYear; offset++) {
      const rim = dialPoint(anchor + offset + fanOffset,dialRadius).join(" ");
      chords.push(`M${origin} L${rim}`);
    }
    for (let offset = 0; offset <= halfYear - 1; offset += .125) {

      svgElement("path",{d:`M${innerX} ${innerY} L${outerX} ${outerY}`,class:"dial-tick"}),
      svgElement("path",{d:`M${x} ${y} L${innerX} ${innerY}`,class:"dial-track"}),
      svgElement("circle",{cx:x,cy:y,r:fanOffsetIndex === 0 ? 5.1 : 3.6,class:"dial-node"}),

    );

  // Reference latitude represents the central Jianghan Plain.

  let scene;

      document.querySelector("#plinth-shadow"),document.querySelector("#farmer-atlas"));

  function showTerm(key) {
    const term = terms[key];
    const declination = Math.asin(Math.sin(23.44 * degrees) * Math.sin(term.longitude * degrees));
    const altitude = Math.PI / 2 - Math.abs(latitude - declination);

    const diagramHeight = 23;
    const sunDistance = 44;
    const sunX = 32 - Math.cos(altitude) * sunDistance;
    const sunY = 62 - Math.sin(altitude) * sunDistance;
    const rayX = sunX - 32;
    const rayY = sunY - 38;
    sundial.style.setProperty("--shadow-length", diagramHeight * shadowRatio + "px");
    sundial.style.setProperty("--sun-position", sunX - 4 + "px");
    sundial.style.setProperty("--sun-height", sunY - 4 + "px");
    sundial.style.setProperty("--ray-length", Math.hypot(rayX,rayY) + "px");
    sundial.style.setProperty("--ray-angle", Math.atan2(rayY,rayX) + "rad");

    const altDeg=(altitude / degrees).toFixed(1);

    shadowLatitude.textContent = "北纬 30.4° · 仰角 " + altDeg + "°";

    return event.clientX >= left && event.clientX <= right && event.clientY >= top && event.clientY <= bottom;

  function selectTerm(index) {
    if (index === targetIndex) return;

      const forward = Math.abs(offset) < .5 ? index > targetIndex : offset > 0;
      const term = terms[key];
      const termType = stops[index] % 2 ? "中气" : "节";

      interludeEnglish.textContent = button.querySelector("small").textContent;
      interludeLongitude.textContent = "太阳黄经 " + term.longitude + "° · " + termType;
      interludeVerse.textContent = term.verse;
      interlude.dataset.term = key;
      interlude.dataset.direction = forward ? "forward" : "backward";
      interlude.dataset.phase = "cover";
      textEntry?.cancel();
      textEntry = interludeText.animate(
        [{transform:"translateY(var(--travel))"},{transform:"translateY(0)"}],
        {duration:520,easing:"cubic-bezier(.3,.61,.28,1)"}
      );
    }
    targetIndex = index;
    pendingIndex = index;
    clearTimeout(settleTimer);
    clearTimeout(interludeTimer);
    interlude.style.setProperty("--dial-angle", -stops[index] * dialStep + "deg");
    ruler.style.setProperty("--ruler-index",stops[index]);
    if (reduceMotion.matches) settleRuler();
    else settleTimer = setTimeout(settleRuler,290);
  }

  ruler.addEventListener("transitionend", event => {
    if (event.target === ruler && event.propertyName === "transform") settleRuler();

  reduceMotion.addEventListener("change", () => {
    if (reduceMotion.matches) {

    }
  });

  for (const button of [...buttons,...yardLinks]) {
    const key = button.dataset.season || button.dataset.yard;
    const index = buttons.findIndex(entry => entry.dataset.season === key);
    button.addEventListener("click",() => selectTerm(index));
    button.addEventListener("keydown",event => {
      let next;
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = buttons.length-1;
      if (event.key === "ArrowUp" || event.key === "ArrowLeft") next = Math.max(0,index-1);
      if (event.key === "ArrowDown" || event.key === "ArrowRight") next = Math.min(buttons.length-1,index+1);
      if (next === undefined) return;
      event.preventDefault();
      yardLinks[next].focus({preventScroll:true});

  function stepYard(direction) {

    if (event.timeStamp - wheelTime > 160 || Math.sign(delta) !== Math.sign(wheelDistance)) {
      wheelUsed = false;
      wheelDistance = 0;
    }
    wheelTime = event.timeStamp;
    wheelDistance += delta;
    if (!wheelUsed && Math.abs(wheelDistance) >= 24) {
      stepYard(Math.sign(delta));
      wheelUsed = true;
    }

  let swipe;
  rulerWindow.addEventListener("pointerdown",event => {
    if (!event.isPrimary || event.button !== 0) { swipe = null; return; }
    swipe = {id:event.pointerId,x:event.clientX,y:event.clientY};
  });
  rulerWindow.addEventListener("pointermove",event => {
    if (!swipe || swipe.id !== event.pointerId) return;
    const dy = event.clientY - swipe.y;
    if (Math.abs(dy) < 32 || Math.abs(dy) <= Math.abs(event.clientX - swipe.x)) return;

    stepYard(-Math.sign(dy));
    swipe = null;
  });
